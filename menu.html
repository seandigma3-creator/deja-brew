<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <title>Deja Brew - Menu</title>
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop">
    <div class="rectangle"></div>
    <div class="group"></div>
    <div class="div"></div>
    
    <!-- Logo -->
    <a href="index.html">
      <img class="logo-coffee" src="https://c.animaapp.com/EQ8uoh66/img/logo-coffee-1@2x.png" alt="Deja Brew Logo" />
    </a>
    
    <!-- Navigation Bar -->
    <div class="group-3">
      <div class="rectangle-3"></div>
      <div class="HOME-MENU-ABOUT-US">
        <a href="index.html">HOME</a>
        <a href="menu.html">MENU</a>
        <a href="about.html">ABOUT US</a>
        <a href="contact.html">CONTACT</a>
      </div>
    </div>

    <!-- Page Title -->
    <p class="p">“Our Handcrafted Menu”</p>

    <!-- Menu Content Banner -->
    <div class="group-2">
      <div class="rectangle-2"></div>
      
      <!-- Styled Menu List -->
      <div class="text-wrapper menu-list">
        <div class="menu-category">
          <h3>HOT BREWS</h3>
          <div class="menu-item"><span>Espresso</span><span class="dots"></span><span>₱110</span></div>
          <div class="menu-item"><span>Americano</span><span class="dots"></span><span>₱125</span></div>
          <div class="menu-item"><span>Cappuccino</span><span class="dots"></span><span>₱145</span></div>
          <div class="menu-item"><span>Caffè Latte</span><span class="dots"></span><span>₱150</span></div>
        </div>

        <div class="menu-category">
          <h3>COLD BREWS</h3>
          <div class="menu-item"><span>Cold Brew Classic</span><span class="dots"></span><span>₱135</span></div>
          <div class="menu-item"><span>Iced Vanilla Latte</span><span class="dots"></span><span>₱160</span></div>
          <div class="menu-item"><span>Caramel Frappé</span><span class="dots"></span><span>₱175</span></div>
        </div>
      </div>

      <img class="cappuccino-coffee" src="https://c.animaapp.com/EQ8uoh66/img/cappuccino-coffee-mug-png--steaming-hot-brewed-coffee-art-1@2x.png" alt="Cappuccino" />
    </div>

    <!-- Bottom Showcase -->
    <img class="steamy-coffee-aroma" src="https://c.animaapp.com/EQ8uoh66/img/steamy-coffee-aroma-stockcake-1@2x.png" alt="Iced Drinks" />
    <p class="text-wrapper-3">Iced Favorites & Specialty Drinks</p>
    
    <img class="img" src="https://c.animaapp.com/EQ8uoh66/img/steamy-coffee-aroma-stockcake-1-1@2x.png" alt="Hot Drinks" />
    <p class="text-wrapper-2">Rich & Freshly Roasted Espresso Shots</p>
